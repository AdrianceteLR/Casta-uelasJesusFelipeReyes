<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detalles del producto | Castañuelas Jesús Felipe Reyes</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/product_details.css">
    </head>
    <body>
        <!-- Cabecera con color sólido -->
        <header class="main-header">
            <h1><a href="/index.html">Castañuelas Jesús Felipe Reyes</a></h1>
            <nav>
                <ul>
                    <li><a href="products.html">Productos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </header> 

        <!-- Sección de Detalles del Producto -->
        <section class="product-details-section">
            <h2 id="product-title">Detalles del Producto</h2>
            <div class="product-details-cards" id="product-details">
                <!-- Los detalles del producto se cargarán dinámicamente aquí -->
            </div>
        </section>

        <footer class="footer-section">
            <p>© 2024 Castañuelas Jesús Felipe Reyes</p>
        </footer>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));

            fetch('../data/castanuelas.json')
                .then(response => response.json())
                .then(data => {
                    const product = data.castanuelas.find(c => c.id === productId);
                    if (product) {
                        const titleElement = document.getElementById('product-title');
                        titleElement.textContent = product.nombre;

                        const detailsSection = document.getElementById('product-details');
                        detailsSection.innerHTML = `
                            <div class="product-details-card">
                                <div class="product-image">
                                    <img src="${product.imagen}" alt="${product.nombre}">
                                </div>
                                <div class="product-info">
                                    <p>${product.descripcion}</p>
                                    <p><strong>Precio:</strong> €${product.precio.toFixed(2)}</p>
                                    <button ${product.disponibilidad ? '' : 'disabled'}>
                                        ${product.disponibilidad ? 'Comprar Ahora' : 'Agotado'}
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        document.getElementById('product-details').innerHTML = '<p>Producto no encontrado.</p>';
                    }
                })
                .catch(error => console.error('Error al cargar el JSON:', error));
        </script>
    </body>
</html>
